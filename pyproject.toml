[project]
name = "git-craft"
version = "0.1.0"
description = "Build concise Git commit messages with an Ollama model"
readme = "README.md"
authors = [
    { name = "ssannssarr", email = "ssantanusarkar8@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.5.0",
    "httpx>=0.28.1",
    "rich>=15.0.0",
]

[project.scripts]
git-craft = "git_craft.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
